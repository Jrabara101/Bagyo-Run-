<!doctype html>
<!-- Source of public/og-image.png, the 1200x630 link preview. Re-export with headless Chrome:
     chrome --headless=new --hide-scrollbars --virtual-time-budget=5000 --window-size=1200,630
            --screenshot=og.png file:///.../tools/og-image.html -->
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Plus+Jakarta+Sans:wght@600;700&display=block" rel="stylesheet" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #15141f; }
  .card { position: relative; width: 1200px; height: 630px; }
  svg.scene { position: absolute; inset: 0; }
  .copy { position: absolute; left: 64px; top: 70px; width: 600px; }
  .kicker { font: 700 20px 'Plus Jakarta Sans', sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #ffe2b0; }
  .logo { font: 150px/1 'Bungee', Impact, sans-serif; color: #f2c230; margin-top: 8px;
          text-shadow: 6px 6px 0 #d6402b, 12px 12px 0 #2b5fb8, 18px 18px 0 #15141f; }
  .chip { display: inline-block; position: relative; margin-top: 30px; padding: 8px 18px 16px; background: #15141f;
          border-radius: 8px; font: 44px 'Bungee', sans-serif; color: #fff; overflow: hidden; }
  .chip::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 9px;
          background: repeating-linear-gradient(-45deg, rgba(0,0,0,.18) 0 5px, transparent 5px 10px), repeating-linear-gradient(45deg, #c9a15a 0 5px, #6e3a26 5px 10px); }
  .tag { margin-top: 26px; font: 700 26px/1.35 'Plus Jakarta Sans', sans-serif; color: #f1ebdd; text-shadow: 0 2px 6px #000; }
  .tag span { color: #f2c230; }
  .pills { margin-top: 22px; display: flex; gap: 10px; }
  .pill { font: 15px 'Bungee', sans-serif; color: #15141f; padding: 6px 12px; border-radius: 6px; }
</style>
</head>
<body>
<div class="card">
  <svg class="scene" viewBox="0 0 1200 630" width="1200" height="630">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#1f1838" /><stop offset="0.55" stop-color="#6b2f57" /><stop offset="0.82" stop-color="#f39a4a" />
      </linearGradient>
      <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#3a2c40" /><stop offset="1" stop-color="#1c1622" />
      </linearGradient>
      <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#15141f" stop-opacity=".92" /><stop offset=".45" stop-color="#15141f" stop-opacity=".55" /><stop offset=".7" stop-color="#15141f" stop-opacity="0" />
      </linearGradient>
      <radialGradient id="glow" cx=".72" cy=".62" r=".35"><stop offset="0" stop-color="#ffaa5a" stop-opacity=".55" /><stop offset="1" stop-color="#ffaa5a" stop-opacity="0" /></radialGradient>
      <pattern id="banig" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <rect width="20" height="20" fill="#6e3a26" /><rect width="10" height="20" fill="#c9a15a" />
      </pattern>
    </defs>
    <rect width="1200" height="400" fill="url(#sky)" />
    <rect width="1200" height="630" fill="url(#glow)" />

    <!-- Typhoon spiral over the horizon -->
    <g transform="translate(900 120) scale(1 .5)" fill="none" stroke="#fff0e1" stroke-opacity=".16" stroke-width="22" stroke-linecap="round">
      <path id="arm" d="M18 0 C 120 -30 230 40 210 150 C 190 250 60 300 -60 270" />
      <use href="#arm" transform="rotate(120)" /><use href="#arm" transform="rotate(240)" />
    </g>

    <!-- Storm clouds -->
    <g fill="#2c2142" opacity=".85">
      <ellipse cx="760" cy="60" rx="170" ry="60" /><ellipse cx="930" cy="40" rx="190" ry="70" /><ellipse cx="1110" cy="70" rx="160" ry="60" />
      <ellipse cx="640" cy="30" rx="140" ry="50" />
    </g>
    <g fill="#3c2a52" opacity=".9">
      <ellipse cx="840" cy="100" rx="120" ry="38" /><ellipse cx="1040" cy="110" rx="140" ry="40" />
    </g>

    <!-- Lightning -->
    <polyline points="1010,110 985,170 1012,172 978,250 1000,252 968,330" fill="none" stroke="#a9c4ff" stroke-opacity=".5" stroke-width="12" stroke-linejoin="round" />
    <polyline points="1010,110 985,170 1012,172 978,250 1000,252 968,330" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" />

    <!-- Ground and road to the vanishing point -->
    <rect y="380" width="1200" height="250" fill="#221a2a" />
    <polygon points="860,380 900,380 1200,630 560,630" fill="url(#road)" />
    <g fill="#f2c230" opacity=".8">
      <polygon points="878,392 882,392 884,410 876,410" /><polygon points="874,428 886,428 890,462 870,462" /><polygon points="866,500 894,500 904,570 856,570" />
    </g>

    <!-- Barangay houses, lit windows -->
    <g>
      <polygon points="560,380 560,300 620,270 680,300 680,380" fill="#4a3a58" />
      <rect x="580" y="320" width="26" height="26" fill="#ffc96b" /><rect x="630" y="320" width="26" height="26" fill="#2a2030" />
      <polygon points="690,380 690,320 740,300 790,320 790,380" fill="#3d3150" />
      <rect x="705" y="335" width="22" height="22" fill="#ffc96b" />
      <polygon points="960,380 960,310 1030,280 1100,310 1100,380" fill="#4a3a58" />
      <rect x="980" y="328" width="28" height="28" fill="#ffc96b" /><rect x="1045" y="328" width="28" height="28" fill="#ffc96b" />
      <polygon points="1110,380 1110,300 1160,280 1200,300 1200,380" fill="#3d3150" />
      <rect x="1130" y="318" width="24" height="24" fill="#2a2030" />
    </g>
    <!-- Poles and wires -->
    <g stroke="#1a1420" stroke-width="6"><line x1="820" y1="380" x2="820" y2="250" /><line x1="950" y1="380" x2="950" y2="250" /></g>
    <path d="M820 262 Q 885 290 950 262 M820 272 Q 885 300 950 272" fill="none" stroke="#1a1420" stroke-width="2" />

    <!-- Banderitas -->
    <path d="M600 250 Q 880 300 1180 240" fill="none" stroke="#2a2030" stroke-width="2" />
    <g>
      <polygon points="640,257 664,262 650,286" fill="#d6402b" /><polygon points="700,268 724,272 709,296" fill="#f2c230" />
      <polygon points="760,276 784,279 770,303" fill="#2b5fb8" /><polygon points="820,280 844,281 831,306" fill="#3d8b4f" />
      <polygon points="880,281 904,281 891,306" fill="#f1ebdd" /><polygon points="940,279 964,277 951,302" fill="#d6402b" />
      <polygon points="1000,274 1024,271 1010,296" fill="#f2c230" /><polygon points="1060,265 1084,261 1070,286" fill="#2b5fb8" />
      <polygon points="1120,253 1144,249 1130,274" fill="#3d8b4f" />
    </g>

    <!-- The kid in the yellow raincoat, running away from us with the red Go-Bag -->
    <g transform="translate(880 600) scale(5.2)">
      <ellipse cx="0" cy="0" rx="9" ry="2" fill="#000" opacity=".35" />
      <g transform="rotate(-18 -2 -9)"><rect x="-3.4" y="-9" width="2.8" height="8" fill="#2f3b63" /><rect x="-3.6" y="-1.8" width="3.2" height="1.8" fill="#e8e8e8" /></g>
      <g transform="rotate(14 2 -9)"><rect x="0.6" y="-9" width="2.8" height="8" fill="#2f3b63" /><rect x="0.4" y="-1.8" width="3.2" height="1.8" fill="#e8e8e8" /></g>
      <rect x="-6.2" y="-17.5" width="2.2" height="7" fill="#d9a91f" transform="rotate(25 -5 -17)" />
      <rect x="4" y="-17.5" width="2.2" height="7" fill="#d9a91f" transform="rotate(-30 5 -17)" />
      <polygon points="-5,-8 5,-8 3.6,-19.5 -3.6,-19.5" fill="#f2c230" />
      <rect x="-4.8" y="-10.6" width="9.6" height=".9" fill="#dfe7ec" />
      <rect x="-3.4" y="-18.6" width="6.8" height="8" fill="#c8402a" /><rect x="-3.4" y="-18.6" width="6.8" height="2.6" fill="#a83220" />
      <rect x="-3.4" y="-13.2" width="6.8" height=".7" fill="#ececec" />
      <circle cx="0" cy="-21.6" r="3.6" fill="#f2c230" />
      <ellipse cx="-1.3" cy="-23.2" rx="1.3" ry=".7" fill="#fff" opacity=".4" />
    </g>

    <!-- Rain -->
    <g stroke="#cfe3ff" stroke-opacity=".35" stroke-width="2" stroke-linecap="round">
      <line x1="640" y1="60" x2="626" y2="100" /><line x1="700" y1="180" x2="686" y2="220" /><line x1="790" y1="120" x2="776" y2="160" />
      <line x1="1080" y1="160" x2="1066" y2="200" /><line x1="1150" y1="330" x2="1136" y2="370" /><line x1="1010" y1="420" x2="996" y2="460" />
      <line x1="720" y1="430" x2="706" y2="470" /><line x1="1120" y1="480" x2="1106" y2="520" /><line x1="610" y1="520" x2="596" y2="560" />
      <line x1="860" y1="200" x2="846" y2="240" /><line x1="1170" y1="210" x2="1156" y2="250" /><line x1="680" y1="330" x2="666" y2="370" />
    </g>

    <rect width="1200" height="630" fill="url(#fade)" />
    <rect y="606" width="1200" height="24" fill="url(#banig)" />
  </svg>

  <div class="copy">
    <div class="kicker">DOST Level Up 3.0 · NSTW 2026</div>
    <div class="logo">TAKBO!</div>
    <div class="chip">BAGYO RUN</div>
    <div class="tag">Race to the evacuation center through<br /><span>typhoon winds, floods and lightning.</span></div>
    <div class="pills">
      <span class="pill" style="background:#5aa9e6">Signal 1 → 5</span>
      <span class="pill" style="background:#f2c230">52 DRRM questions</span>
      <span class="pill" style="background:#6cc070">English · Filipino</span>
    </div>
  </div>
</div>
</body>
</html>
